---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ansible and repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install validation tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate YAML
        run: yamllint .

      - name: Lint Ansible content
        run: ansible-lint ansible

      - name: Check every playbook's syntax
        working-directory: ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/.github/ansible-ci.cfg
        run: |
          for playbook in *.yml; do
            ansible-playbook -i inventory/hosts.yml "$playbook" --syntax-check
          done

      - name: Compile Python sources
        run: python -m compileall -q application scripts/check-markdown-links.py

      - name: Check shell scripts
        run: shellcheck scripts/*.sh

      - name: Check local Markdown links
        run: python scripts/check-markdown-links.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
