---
- name: Require the PostgreSQL primary for backups
  ansible.builtin.assert:
    that:
      - postgresql_node_role == 'primary'
    fail_msg: Scheduled logical backups must run on the PostgreSQL primary.

- name: Create the protected backup directory
  ansible.builtin.file:
    path: "{{ postgresql_backup_directory }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Install the PostgreSQL backup script
  ansible.builtin.template:
    src: backup-postgresql.sh.j2
    dest: /usr/local/sbin/backup-onprem-postgresql
    owner: root
    group: root
    mode: "0755"
    validate: /bin/bash -n %s

- name: Install the backup service
  ansible.builtin.template:
    src: onprem-postgresql-backup.service.j2
    dest: /etc/systemd/system/onprem-postgresql-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install the backup timer
  ansible.builtin.template:
    src: onprem-postgresql-backup.timer.j2
    dest: /etc/systemd/system/onprem-postgresql-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Apply systemd unit changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start the backup timer
  ansible.builtin.systemd_service:
    name: onprem-postgresql-backup.timer
    enabled: true
    state: started

- name: Read backup timer state
  ansible.builtin.command: systemctl is-active onprem-postgresql-backup.timer
  register: postgresql_backup_timer_state
  changed_when: false
  failed_when: postgresql_backup_timer_state.stdout != 'active'

- name: Verify the backup script syntax
  ansible.builtin.command: /bin/bash -n /usr/local/sbin/backup-onprem-postgresql
  changed_when: false

